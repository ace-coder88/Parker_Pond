# Nginx reverse proxy for Parker Birds Shiny app (Docker on 127.0.0.1:3838)
# Install: copy to /etc/nginx/sites-available/parker-birds and symlink into sites-enabled.
#
# Before certbot, set server_name to your domain (or leave _ for IP-only HTTP).
# Then: sudo certbot --nginx -d your.domain.example

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3838;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
